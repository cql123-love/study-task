<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyTask{% endblock %} · 个人学习任务管理系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container bar-inner">
      <a class="brand" href="{{ url_for('index') }}">📚 StudyTask</a>
      <a class="btn btn-primary" href="{{ url_for('create') }}">＋ 新建任务</a>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flashes">
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">StudyTask 个人学习任务管理系统 · 《软件工程》实验一</footer>
</body>
</html>
