{% extends "base.html" %}
{% block title %}删除确认{% endblock %}
{% block content %}
<h2>删除确认</h2>
<p class="confirm-text">确定要删除任务 <strong>「{{ task.name }}」</strong>（{{ task.course }}，截止 {{ task.due_date }}）吗？</p>
<p class="confirm-text muted">删除后数据将从数据库中移除，不可恢复。</p>
<form method="post" class="form-actions">
  <input type="hidden" name="confirm" value="yes">
  <button type="submit" class="btn danger">确认删除</button>
  <a class="btn btn-ghost" href="{{ url_for('index') }}">取消</a>
</form>
{% endblock %}
