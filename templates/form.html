{% extends "base.html" %}
{% block title %}{{ '编辑任务' if mode=='edit' else '新建任务' }}{% endblock %}
{% block content %}
<h2>{{ '编辑任务' if mode=='edit' else '新建任务' }}</h2>
<form method="post" class="task-form">
  <label>任务名称 <span class="req">*</span>
    <input type="text" name="name" maxlength="100" required
           value="{{ task.name if task else '' }}" placeholder="1—100字">
  </label>
  <label>所属课程 <span class="req">*</span>
    <input type="text" name="course" maxlength="60" required
           value="{{ task.course if task else '' }}" placeholder="1—60字">
  </label>
  <label>任务描述
    <textarea name="description" maxlength="1000"
              placeholder="选填，不超过1000字">{{ task.description if task else '' }}</textarea>
  </label>
  <label>截止日期 <span class="req">*</span>
    <input type="date" name="due_date" required
           value="{{ task.due_date if task else '' }}">
  </label>
  <label>优先级 <span class="req">*</span>
    <select name="priority">
      {% for p in priorities %}
      <option value="{{ p }}" {% if task and task.priority == p %}selected{% elif not task and p == '中' %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">保存</button>
    <a class="btn btn-ghost" href="{{ url_for('index') }}">取消</a>
  </div>
</form>
{% endblock %}
